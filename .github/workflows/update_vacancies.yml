name: Update vacancy counts

on:
  schedule:
    - cron: '0 6 */8 * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Fetch vacancy counts from Reed
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: python fetch_vacancies.py

      - name: Commit and push updated vacancies.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vacancies.json
          git diff --staged --quiet || git commit -m "Update vacancy counts $(date +'%Y-%m-%d')"
          git push
